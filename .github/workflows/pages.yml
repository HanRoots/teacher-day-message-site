name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure backend API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e "const fs=require('fs');const api=process.env.API_BASE_URL||'';fs.writeFileSync('public/config.js','window.APP_CONFIG = '+JSON.stringify({apiBase:api})+';\\n')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
